[workspace]
members = ["crates/*", "crates/kola-print/macro"]

[workspace.dependencies]
# Kola Crates
kola-builtins = { path = "crates/kola-builtins" }
kola-collections = { path = "crates/kola-collections" }
kola-driver = { path = "crates/kola-driver" }
kola-ir = { path = "crates/kola-ir" }
kola-lowerer = { path = "crates/kola-lowerer" }
kola-ls = { path = "crates/kola-ls" }
kola-machine = { path = "crates/kola-machine" }
kola-print = { path = "crates/kola-print" }
kola-resolver = { path = "crates/kola-resolver" }
kola-runtime = { path = "crates/kola-runtime" }
kola-span = { path = "crates/kola-span" }
kola-subst = { path = "crates/kola-subst" }
kola-syntax = { path = "crates/kola-syntax" }
kola-tree = { path = "crates/kola-tree" }
kola-typer = { path = "crates/kola-typer" }
kola-types = { path = "crates/kola-types" }
kola-utils = { path = "crates/kola-utils" }

camino = "1.2"
indexmap = "2.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
derive_more = { version = "2.1", features = [
    "from",
    "try_into",
    "display",
    "into_iterator",
    "from_str",
] }
enum-as-inner = "0.7"
kinded = "0.5"
owo-colors = "4.3"
thiserror = "2.0"
pastey = "0.2"
log = "0.4"
enumset = "1.1"
unscanny = "0.1"
rayon = "1.12"


[package]
name = "kola"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
kola-print.workspace = true
kola-driver.workspace = true
kola-utils.workspace = true

camino.workspace = true
log.workspace = true
clap = { version = "4.6", features = ["derive"] }
env_logger = "0.11"
concolor = { version = "0.1", features = ["auto"] }

[profile.release]
debug = true
